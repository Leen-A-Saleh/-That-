<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المواعيد</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="../images/Silver.png" />
    <link rel="shortcut icon" href="../images/Silver.png" />
    <link rel="apple-touch-icon" href="../images/Silver.png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./appointments.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="menu-btn" id="menuBtn"><i class="fa fa-bars"></i></div>
      <div class="nav-title">المواعيد</div>
      <div class="nav-right">
        <a href="../client-notifications-page/notifications.html" class="bell">
          <i class="fa-regular fa-bell"></i>
          <span class="dot" id="notificationDot"></span>
        </a>
      </div>
    </header>

    <aside class="sidebar">
      <div class="logo">
        <img src="../images/Frame 393.svg" alt="logo" />
      </div>
      <div class="user">
        <div class="user-info">
          <span class="user-greeting">أهلاً بك</span>
          <span id="username"></span>
        </div>
      </div>
      <ul>
        <li>
          <a href="../index.html"
            ><img src="../images/Icon.svg" alt="" />الرئيسية</a
          >
        </li>
        <li class="active">
          <a href="../client-appointments-page/appointments.html"
            ><img src="../images/Icon1.svg" alt="" />المواعيد</a
          >
        </li>
        <li>
          <a href="../client-chat-page/chat.html"
            ><img src="../images/Icon2.svg" alt="" />الرسائل</a
          >
        </li>
        <li>
          <a href="../client-tests-page/tests.html"
            ><img src="../images/Icon3.svg" alt="" />الإختبارات</a
          >
        </li>
        <li>
          <a href="../client-games-page/index.html"
            ><img src="../images/Icon4.svg" alt="" />الأنشطة</a
          >
        </li>
        <li>
          <a href="../client-notifications-page/notifications.html"
            ><img src="../images/Icon6.svg" alt="" />الإشعارات</a
          >
        </li>
        <li>
          <a href="../client-profile-page/profile.html"
            ><img src="../images/Icon7.svg" alt="" />الملف الشخصي</a
          >
        </li>
      </ul>
      <button class="logout" id="logoutBtn">
        تسجيل الخروج <i class="fa fa-arrow-left"></i>
      </button>
    </aside>

    <main class="main">
      <section class="appointments-section">
        <h2>تقويم مواعيدي</h2>
        <div class="calendar-header">
          <button id="prevMonth">&lt;</button>
          <h3 id="monthYear"></h3>
          <button id="nextMonth">&gt;</button>
        </div>
        <div class="weekdays">
          <div>أحد</div>
          <div>اثنين</div>
          <div>ثلاثاء</div>
          <div>أربعاء</div>
          <div>خميس</div>
          <div>جمعة</div>
          <div>سبت</div>
        </div>
        <div id="calendar"></div>
      </section>

      <div id="bookingDetails" class="booking-details hidden">
        <h3>تفاصيل الحجز</h3>
        <p id="detailsContent"></p>
        <button id="closeDetails">إغلاق</button>
      </div>
      <section class="appointments-list">
        <h2>جميع المواعيد</h2>
        <div id="appointmentsContainer"></div>
      </section>
    </main>

    <footer>© 2026 ذات للإستشارات النفسية جميع الحقوق محفوظة</footer>
    <script src="./appointments.js"></script>
  </body>
</html>
